version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: app_db
      POSTGRES_USER: app_user
      POSTGRES_PASSWORD: secretpassword
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  api:
    build:
      context: ./api-rust
    container_name: api-rust
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://app_user:secretpassword@postgres:5432/app_db
    ports:
      - "3000:3000"
    depends_on:
      - postgres

  front:
    image: nginx:alpine
    container_name: front-nginx
    restart: unless-stopped
    ports:
      - "8080:80"
    volumes:
      - ./front:/usr/share/nginx/html:ro

  motoradmin:
    image: motoradmin/motoradmin
    container_name: motoradmin
    restart: unless-stopped
    ports:
      - "3001:3000"
    depends_on:
      - postgres

volumes:
  postgres_data:
